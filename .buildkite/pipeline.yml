steps:
  - label: run bats tests
    plugins:
      - plugin-tester#v2.0.0: ~

  - label: ":bash: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/*

  - label: ":sparkles: Linter"
    plugins:
      - plugin-linter#v4.1.0:
          id: golang-cross-compile

  - wait
  - label: ":pipeline: example 1"
    plugins:
      - ${BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          debug: true
          build: ./tests/helloworld
          import: github.com/buildkite-plugins/golang-cross-compile-buildkite-plugin
          targets:
            - version: "1.20"
              goos: linux
              goarch: amd64
              buildvcs: false
            - version: "1.20"
              goos: windows
              goarch: amd64
              buildvcs: false
            - version: "1.20"
              goos: darwin
              goarch: amd64
              buildvcs: false
